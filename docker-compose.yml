services:
  xmas:
    build: .
    restart: unless-stopped
    # Host networking: mDNS discovery and DDP UDP to the WLED controllers need to be on the LAN directly.
    network_mode: host
    environment:
      # Set XMAS_PORT in .env if 8080 is taken on the host (host networking shares its ports).
      PORT: ${XMAS_PORT:-8080}
      # Address to listen on. Set XMAS_HOST=127.0.0.1 in .env if only cloudflared on this machine should reach it.
      HOST: ${XMAS_HOST:-0.0.0.0}
      XMAS_API_TOKEN: ${XMAS_API_TOKEN:-}
      # Time zone for Scrolling Text's #TIME/#DATE tokens, e.g. America/Chicago.
      TZ: ${XMAS_TZ:-UTC}
    volumes:
      - ./data:/data
    stop_grace_period: 10s
