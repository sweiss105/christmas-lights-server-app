services:
  xmas:
    build: .
    restart: unless-stopped
    # Host networking: mDNS discovery and DDP UDP to the WLED controllers need to be on the LAN directly.
    network_mode: host
    environment:
      # Set XMAS_PORT in .env if 8080 is taken on the host (host networking shares its ports).
      PORT: ${XMAS_PORT:-8080}
      # Address to listen on. Set XMAS_HOST=127.0.0.1 in .env if only cloudflared on this machine should reach it.
      HOST: ${XMAS_HOST:-0.0.0.0}
      XMAS_API_TOKEN: ${XMAS_API_TOKEN:-}
      # Time zone for Scrolling Text's #TIME/#DATE tokens, e.g. America/Chicago.
      TZ: ${XMAS_TZ:-UTC}
      # Home Assistant (MQTT discovery). Off unless XMAS_MQTT_URL is set, e.g. mqtt://10.10.1.5:1883
      # (the broker, usually Home Assistant's Mosquitto add-on). See "Home Assistant" in README.md.
      XMAS_MQTT_URL: ${XMAS_MQTT_URL:-}
      # The MQTT user the app signs in as (create one for it in Home Assistant). The password is never logged.
      XMAS_MQTT_USERNAME: ${XMAS_MQTT_USERNAME:-}
      XMAS_MQTT_PASSWORD: ${XMAS_MQTT_PASSWORD:-}
      # Only change these if your Home Assistant uses another discovery prefix, or to run two copies of the app.
      XMAS_MQTT_DISCOVERY_PREFIX: ${XMAS_MQTT_DISCOVERY_PREFIX:-homeassistant}
      XMAS_MQTT_TOPIC: ${XMAS_MQTT_TOPIC:-xmas}
    volumes:
      - ./data:/data
    stop_grace_period: 10s
